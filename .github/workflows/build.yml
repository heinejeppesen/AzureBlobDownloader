name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Weekly security check, also when nothing is committed: the restore audits every package against the
  # GitHub Advisory Database and fails on high/critical vulnerabilities (see Directory.Build.props).
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build AzureBlobDownloader.slnx -c Release

      - name: Test
        run: dotnet test --solution AzureBlobDownloader.slnx -c Release --no-build

      # Report only (the build above already fails on high/critical): lists every vulnerable package,
      # including indirect ones, with its severity and advisory link.
      - name: Vulnerable packages
        if: matrix.os == 'ubuntu-latest'
        run: dotnet list AzureBlobDownloader.slnx package --vulnerable --include-transitive

  package:
    name: Package (${{ matrix.rid }})
    needs: test
    # The weekly scheduled run is a security check only; packages are built for pushes, tags and manual runs.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            packages: '*-setup.exe *.zip'
          - rid: win-arm64
            os: windows-latest
            packages: '*-setup.exe *.zip'
          - rid: osx-arm64
            os: macos-latest
            packages: '*.dmg'
          - rid: linux-x64
            os: ubuntu-latest
            packages: '*.AppImage *.tar.gz'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # v1.2.3 tags build version 1.2.3; other builds are <Version from Directory.Build.props>-ci.<run number>.
      - name: Version
        id: version
        shell: bash
        run: |
          base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF#refs/tags/v}"; else version="$base-ci.$GITHUB_RUN_NUMBER"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=${version%%-*}" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Publish self-contained
        shell: bash
        run: dotnet publish src/AzureBlobDownloader.App -c Release -r ${{ matrix.rid }} -o publish -p:Version=${{ steps.version.outputs.version }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/package-windows.ps1 -Rid ${{ matrix.rid }} -PublishDir publish -Version ${{ steps.version.outputs.version }} -NumericVersion ${{ steps.version.outputs.numeric }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash build/package-macos.sh publish ${{ steps.version.outputs.version }} ${{ steps.version.outputs.numeric }} ${{ github.run_number }} dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: bash build/package-linux.sh publish ${{ steps.version.outputs.version }} dist

      # One artifact per file, uploaded as is (no extra zip), so downloads keep their names.
      - name: List packages
        id: files
        shell: bash
        run: |
          cd dist
          files=$(ls ${{ matrix.packages }})
          echo "$files"
          echo "first=$(echo "$files" | sed -n 1p)" >> "$GITHUB_OUTPUT"
          echo "second=$(echo "$files" | sed -n 2p)" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ steps.files.outputs.first }}
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.files.outputs.first }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload ${{ steps.files.outputs.second }}
        if: steps.files.outputs.second != ''
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.files.outputs.second }}
          archive: false
          retention-days: 30
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Lets users check that a download is exactly the file built here (the packages are not code-signed).
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The version's CHANGELOG.md section plus .github/release-notes.md; fails without a changelog entry.
      - name: Release notes
        run: bash build/release-notes.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Azure Blob Downloader ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --generate-notes
